services:
  slack-bot:
    build:
      context: .
      dockerfile: apps/slack-bot/Dockerfile
    ports:
      - "3001:3001"
    env_file: "scrappy.env"
    environment:
      - PG_DATABASE_URL=${PG_DATABASE_URL}
      - GRAPHITE_HOST=${GRAPHITE_HOST}
  scrapbook:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - APP_URL=${APP_URL}
    ports:
      - "3002:3000"
    env_file: "scrappy.env"
    environment:
      - PG_DATABASE_URL=${PG_DATABASE_URL}
      - GRAPHITE_HOST=${GRAPHITE_HOST}
      - APP_URL=${APP_URL}
